name: Android prerelease

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: x86_64-linux-android,aarch64-linux-android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Rust libraries
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build_android_native.sh release

      - name: Build Android APK
        run: |
          flutter pub get
          flutter build apk --release --target lib/main_android.dart --target-platform android-arm64,android-x64 --no-pub

      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          cp "$apk" "nauterm-a-${GITHUB_REF_NAME}-android-arm64-x64.apk"
          sha256sum "nauterm-a-${GITHUB_REF_NAME}-android-arm64-x64.apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            "nauterm-a-${GITHUB_REF_NAME}-android-arm64-x64.apk" SHA256SUMS.txt \
            --title "Nauterm-A ${GITHUB_REF_NAME#android-v} (Android test)" \
            --notes 'Android 大屏/键鼠实验版本。SSH/SFTP 尚未充分实机验证；本地终端、串口、FIDO2 和 Mosh 暂不支持。' \
            --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: nauterm-a-android
          path: build/app/outputs/flutter-apk/app-release.apk
